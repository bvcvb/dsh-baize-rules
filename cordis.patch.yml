# dsh-baize-rules bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package. When
# installed via `dsh plugin --profile <name> add dsh-baize-rules@<version>`, the
# command reconciles `dsh.profile.bundles` against installed packages and mounts
# this patch (a single `insert` of the plugin row) — exactly like the manual
# cordis.patch.yml mount line. The plugin's own `name='baize-rules'` is used for
# the injected `user/message` source attribution.
#
# To tune the defaults, add fields to the `config` of the inserted row (it
# mirrors the plugin `Config` schema):
#   scope: global | session | project   default scope for scope-less commands (required)
#   maxBytes: <number>                  model-visible byte budget (required)
#   injectAtEveryStep: <boolean>        re-publish the snapshot on every step (debug)
#   injectTags: <boolean>               render `[tag,…]` prefixes into the model context
#   apiOriginCheck: <boolean>           panel API accepts same-machine/same-origin only (default true;
#                                       turn off when a reverse proxy fronts the web UI)
#   refreshAfterSteps: <number>         republish the snapshot once the last copy is this many steps
#                                       old (default 20; 0 disables the periodic refresh)
- insert:
    - id: baize-rules
      name: 'dsh-baize-rules'
      config:
        scope: session
        maxBytes: 8192
